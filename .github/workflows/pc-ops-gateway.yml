name: pc-ops-gateway
on:
  push:
    branches: [agent/pc-ops-gateway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Verify deterministic gateway artifacts
        run: node --input-type=module -e "import fs from 'node:fs';import crypto from 'node:crypto';const c=v=>Array.isArray(v)?'['+v.map(c).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+c(v[k])).join(',')+'}':JSON.stringify(v);for(const p of ['conformance/pc_ops.gateway.v1/tool-manifest','conformance/pc_ops.gateway.v1/e2e-scenarios','conformance/pc_ops.gateway.v1/producer-fixture-pins','conformance/pc_ops.gateway.v1/producer-matrix','conformance/reports/pc-ops-gateway-e2e-v1']){const o=JSON.parse(fs.readFileSync(p+'.json','utf8'));const h=crypto.createHash('sha256').update(c(o)).digest('hex');if(h!==fs.readFileSync(p+'.sha256','utf8').trim())throw new Error(p+' hash mismatch');}"
