name: CI

on:
  push:
    branches:
      - agent/pc-control-plane
      - agent/pc-native-mcp
      - agent/pc-native-mcp-host
      - agent/pc-native-control-full-stack
      - agent/pc-native-control-relay-integrated
      - agent/pc-native-control-relay-provider
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Official MCP host integration
        run: npm run test:mcp-host
      - name: Native MCP/control facade
        run: npm run test:native-mcp
      - name: Native remote relay
        run: npm run test:relay
      - name: Native relay provider bridge
        run: npm run test:relay-provider
      - name: Desktop Commander compatibility surface
        run: npm run test:dc-compat
      - name: Focused execution-context and Vision epoch reconciliation
        run: npm run test:context-epoch
      - name: Frozen Wave 8 E2E readiness
        run: npm run test:e2e
      - name: Focused Executor preflight admission
        run: npm run test:preflight
      - name: Focused Executor journal recovery
        run: npm run test:journal
      - name: Full test suite
        run: npm test
