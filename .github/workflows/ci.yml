name: CI

on:
  push:
    branches:
      - agent/pc-control-plane
      - agent/pc-ops-chaos
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Focused E2E readiness
        run: npm run test:e2e
      - name: Focused Executor preflight admission
        run: npm run test:preflight
      - name: Focused Executor journal recovery
        run: npm run test:journal
      - name: Focused PC ops chaos
        run: npm run test:chaos
      - name: Full test suite
        run: npm test
