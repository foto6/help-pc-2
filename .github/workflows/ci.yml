name: CI

on:
  push:
    branches:
      - agent/r22-independent-integration-20260929
      - agent/pc-control-plane
      - agent/pc-native-mcp
      - agent/pc-native-mcp-host
      - agent/pc-native-control-integrated
      - agent/pc-native-control-full-dc
      - agent/pc-native-control-final-candidate
      - agent/pc-control-wire-registry-r15-20260928
      - agent/native-mcp-r23-hardening-20261001
      - agent/native-mcp-r25-r24-health-consumer-20261001
      - agent/native-mcp-r26-relay-progress-consumer-20261001
      - agent/native-mcp-r27-cutover-authority-gate-20261001
      - agent/native-mcp-r28-relay-freshness-qa-20261001
      - agent/native-mcp-r29-relay-cutover-qa-20261002
      - agent/native-mcp-r30-direct-remote-lane-20261002
      - agent/native-mcp-r31-pc-control-direct-lane-20261002
      - agent/native-mcp-r32-local-canary-operator-20261002
      - agent/native-mcp-r33-live-readonly-canary-preflight-20261002
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Official MCP host integration
        run: npm run test:mcp-host
      - name: Native MCP/control facade
        run: npm run test:native-mcp
      - name: Production bridge identity security
        run: npm run test:security
      - name: Exact PC Core frozen/parity wire routes
        run: node --test test/native-relay-registry-route.test.js
      - name: Native relay provider bridge
        run: npm run test:provider
      - name: Native remote relay
        run: npm run test:relay
      - name: Final MCP to relay end-to-end
        run: npm run test:final-control
      - name: Desktop Commander compatibility surface
        run: npm run test:dc-compat
      - name: Focused execution-context and Vision epoch reconciliation
        run: npm run test:context-epoch
      - name: Frozen Wave 8 E2E readiness
        run: npm run test:e2e
      - name: Focused Executor preflight admission
        run: npm run test:preflight
      - name: Focused Executor journal recovery
        run: npm run test:journal
      - name: R23 native MCP/control hardening
        run: npm run test:r23
      - name: R23 autonomous soak/chaos
        run: npm run test:r23-soak
      - name: R25 consume exact R24 runtime health
        run: npm run test:r25-health
      - name: R26 consume exact relay progress health
        run: npm run test:r26-relay-progress
      - name: R27 integrated cutover authority gate
        run: npm run test:r27-cutover
      - name: R28 independent relay freshness gate
        run: npm run test:r28-relay-freshness
      - name: R28 independent relay freshness QA
        run: node --test test/r28-relay-freshness-gate.test.js
      - name: R29 independent relay cutover/autostart QA
        run: npm run test:r29-relay-cutover-qa
      - name: R30 direct authenticated remote MCP lane
        run: npm run test:r30-direct-remote
      - name: R31 pc-control direct-lane candidate
        run: npm run test:r31-pc-control-direct
      - name: R32 local read-only canary operator
        run: npm run test:r32-local-canary
      - name: R32 PowerShell operator syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/r32-local-canary-operator.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: R33 live read-only canary preflight
        run: npm run test:r33-live-preflight
      - name: R33 PowerShell preflight syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/r33-live-readonly-canary-preflight.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Full test suite
        run: npm test
      - name: Generate exact-head R27 coordinator handoff
        run: node tools/r27-cutover-handoff-report.js --out r27-coordinator-handoff-${{ matrix.os }}.json
      - name: Upload exact-head R27 coordinator handoff
        uses: actions/upload-artifact@v4
        with:
          name: r27-coordinator-handoff-${{ matrix.os }}
          path: r27-coordinator-handoff-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head R29 relay cutover QA report
        run: node tools/r29-relay-cutover-qa-report.js --out r29-relay-cutover-qa-${{ matrix.os }}.json
      - name: Upload exact-head R29 relay cutover QA report
        uses: actions/upload-artifact@v4
        with:
          name: r29-relay-cutover-qa-${{ matrix.os }}
          path: r29-relay-cutover-qa-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head R30 direct remote readiness
        run: node tools/r30-direct-remote-readiness-report.js --out r30-direct-remote-readiness-${{ matrix.os }}.json
      - name: Upload exact-head R30 direct remote readiness
        uses: actions/upload-artifact@v4
        with:
          name: r30-direct-remote-readiness-${{ matrix.os }}
          path: r30-direct-remote-readiness-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head R31 pc-control direct readiness
        run: node tools/r31-pc-control-direct-readiness-report.js --out r31-pc-control-direct-readiness-${{ matrix.os }}.json
      - name: Upload exact-head R31 pc-control direct readiness
        uses: actions/upload-artifact@v4
        with:
          name: r31-pc-control-direct-readiness-${{ matrix.os }}
          path: r31-pc-control-direct-readiness-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head R32 local canary readiness
        run: node tools/r32-local-canary-readiness-report.js --out r32-local-canary-readiness-${{ matrix.os }}.json
      - name: Upload exact-head R32 local canary readiness
        uses: actions/upload-artifact@v4
        with:
          name: r32-local-canary-readiness-${{ matrix.os }}
          path: r32-local-canary-readiness-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Generate exact-head R33 preflight readiness
        run: node tools/r33-preflight-readiness-report.js --out r33-preflight-readiness-${{ matrix.os }}.json
      - name: Upload exact-head R33 preflight readiness
        uses: actions/upload-artifact@v4
        with:
          name: r33-preflight-readiness-${{ matrix.os }}
          path: r33-preflight-readiness-${{ matrix.os }}.json
          if-no-files-found: error
          retention-days: 14
